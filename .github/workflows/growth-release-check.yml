name: Validate search and measurement release
on:
  push:
    branches: ['growth/search-and-measurement']
    paths: ['.github/workflows/growth-release-check.yml']
permissions:
  contents: write
  actions: read
jobs:
  package-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reproduce the exact build which passed the full browser suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          source=subprocess.check_output(['git','show','ccac652c710f7e8b20390542408d2a56b541713f:.github/workflows/growth-release-check.yml'],text=True)
          start=source.index('          python3 - ')
          end=source.index('      - name: Install pinned browser tools',start)
          Path('/tmp/reproduce-reviewed.sh').write_text(textwrap.dedent(source[start:end]))
          PY
          bash /tmp/reproduce-reviewed.sh
      - uses: actions/download-artifact@v4
        with:
          name: search-measurement-validation
          run-id: 34195045639
          github-token: ${{ github.token }}
          path: /tmp/reviewed
      - name: Verify source equality and the successful full-suite report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          old=Path('/tmp/reviewed')
          for name in ['assets/growth.js','tools/build_growth.py','index.html','worlds/bayport/index.html','site-inventory.json']:
              assert Path(name).read_bytes()==(old/name).read_bytes(), 'Previously tested source changed: '+name
          r=json.loads((old/'test-results/growth-report.json').read_text())
          assert len(r['seo'])==20 and len(r['layouts'])==20 and len(r['players'])==2
          assert all(x['realWebGL']=='rendered' and x['trustedControlInput']=='pass' and not x['errors'] for x in r['players'])
          assert r['privacy']['beforeConsentRequests']==0 and r['privacy']['globalPrivacyControl']=='pass'
          print('Exact source equality verified against the passing 20-page, 20-layout, two-world browser run.')
          PY
      - name: Encode the actual browser recording and add it to the tour pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p assets/tours
          ffmpeg -y -hide_banner -loglevel error -ss "$(cat /tmp/reviewed/test-results/video/offset.txt)" -i /tmp/reviewed/test-results/video/raw.webm -t 12 -an -c:v libvpx-vp9 -b:v 900k assets/tours/bayport-tour.webm
          test "$(stat -c%s assets/tours/bayport-tour.webm)" -gt 20000
          python3 tools/build_growth.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          assert len(json.loads(Path('site-inventory.json').read_text())['pages'])==20
          for p in ['guides/bayport-day-night/index.html','zh/guides/bayport-day-night/index.html']:
              s=Path(p).read_text();assert 'bayport-tour.webm' in s and 'preload="none"' in s
          PY
      - name: Commit the reviewed public release on the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html zh worlds guides about privacy monitor tools/campaign-builder assets/growth.js assets/home.js assets/site-config.js assets/tours assets/previews/manifest.json airport.html bayline.html sitemap.xml robots.txt site-inventory.json docs/robots-host-root.txt tools/templates/home.html tests/growth-check.cjs
          git diff --cached --quiet || git commit -m 'Build validated bilingual search pages and consent-aware play analytics'
          git push origin HEAD:growth/search-and-measurement
      - uses: actions/upload-artifact@v4
        with:
          name: growth-deployable-release
          path: |
            assets/tours/
            site-inventory.json
            index.html
            worlds/
            zh/
            guides/
            about/
            privacy/
            monitor/
            assets/growth.js
            assets/growth.css
            assets/site-config.js
            tools/build_growth.py
            tools/templates/home.html
            tests/growth-check.cjs
          retention-days: 7
