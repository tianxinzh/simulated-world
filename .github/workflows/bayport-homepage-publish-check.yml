name: Verify BAYPORT v2.1 homepage update
on:
  push:
    branches: ['publish/bayport-v2-1-homepage']
    paths: ['.github/workflows/bayport-homepage-publish-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reproduce exact homepage files already validated by the full gallery suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          source=subprocess.check_output(['git','show','dd27e33c956cfc135922ef77f16a180f0473dbc6:.github/workflows/bayport-homepage-publish-check.yml'],text=True)
          marker="          python3 - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index('\n          PY',start)
          exec(compile(textwrap.dedent(source[start:end]),'verified-homepage-update','exec'))
          assert blob('index.html')=='3c7f20af7877bc0302c1283f91f54928f7ae43b8'
          assert blob('assets/home.js')=='8c35e5959ec44a7709d030dc127db6a62cc55473'
          print('Exact files from passing 5-width EN/ZH Chromium gallery tests reproduced.')
          PY
      - name: Install existing pinned browser tools
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify release links, real WebGL version and asynchronous preview cleanup
        run: |
          mkdir -p test-results
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/release-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:950}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
              const urls=await page.locator('a[href*="airport.html"]').evaluateAll(xs=>xs.map(x=>x.getAttribute('href')));
              assert(urls.length>=3);assert(urls.every(u=>u==='airport.html?v=2.1'));
              assert.equal(await page.locator('.world-card[data-category="air"] .card-live').innerText(),'Updated · v2.1');
              await page.locator('.world-card[data-category="air"]').scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>[...document.images].every(i=>i.complete&&i.naturalWidth>0));
              const images=await page.locator('img[src*="bayport"]').evaluateAll(xs=>xs.map(x=>({src:x.src,current:x.currentSrc,loaded:x.complete&&x.naturalWidth>0})));
              assert(images.length===2);assert(images.every(i=>i.loaded&&i.current.includes('v=fac07aef')));
              await page.locator('.world-card [data-preview="bayport"]').click();
              assert.equal(await page.locator('#preview-launch').getAttribute('href'),'airport.html?v=2.1');
              assert.equal(await page.locator('#preview-fallback').getAttribute('href'),'airport.html?v=2.1');
              assert.equal(await page.locator('#preview-mount iframe').getAttribute('src'),'airport.html?v=2.1');
              const frame=await(await page.locator('#preview-mount iframe').elementHandle()).contentFrame();
              await frame.waitForFunction(()=>window.__airport,null,{timeout:90000});
              assert.equal(await frame.evaluate(()=>window.__airport.version),'2.1-aircraft-framing');
              await page.screenshot({path:'test-results/bayport-v2-1-preview.png'});
              await page.locator('#preview-close').click();
              await page.waitForFunction(()=>document.querySelectorAll('iframe').length===0&&!document.querySelector('#world-preview').open);
              assert(!await page.locator('body').evaluate(e=>e.classList.contains('preview-open')));
              assert.deepEqual(errors,[]);
              fs.writeFileSync('test-results/release-links.json',JSON.stringify({version:'2.1-aircraft-framing',urls,images,iframe:'airport.html?v=2.1',previewCleanup:true,errors,verified:true},null,2));
              console.log('Release URLs, preview images, actual BAYPORT version and preview cleanup: PASS');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayport-v2-1-homepage-release-check
          path: |
            test-results/
            index.html
            assets/home.js
          retention-days: 3
      - name: Commit only tested homepage files to the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/home.js
          git commit -m 'Feature BAYPORT v2.1 on homepage with current preview and release links'
          git push origin HEAD:publish/bayport-v2-1-homepage
