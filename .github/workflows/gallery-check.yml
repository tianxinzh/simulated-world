name: Test gallery in Chromium
on:
  pull_request:
  push:
    branches: [main]
    paths: ['index.html', 'site-config.json', 'assets/**', 'worlds/**', 'zh/**', 'guides/**', 'tools/**', 'tests/**', '.github/workflows/gallery-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Rebuild discovery pages with isolated analytics configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('site-config.json');c=json.loads(p.read_text());c['measurementId']='';p.write_text(json.dumps(c))
          PY
          python3 tools/build_growth.py
          node --check assets/growth.js
          node --check assets/home.js
      - name: Install pinned browser tools
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check SEO, layout, real controls and analytics privacy
        run: |
          mkdir -p /tmp/sw-site
          ln -s "$GITHUB_WORKSPACE" /tmp/sw-site/simulated-world
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/sw-site >/tmp/gallery-server.log 2>&1 &
          node tests/growth-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-browser-tests
          path: test-results/
          retention-days: 7
