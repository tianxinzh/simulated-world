name: Assemble Bayline

on:
  push:
    branches: [main]
    paths:
      - '.build/bayline/READY'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble and verify final single-file demo
        shell: bash
        run: |
          set -euo pipefail
          cat .build/bayline/part-*.b64 | base64 --decode | gzip --decompress > bayline.html
          test "$(wc -c < bayline.html)" -eq 91534
          echo "c0205d920ec62369a1df8f65bee33d705c7e1059ed55359ea8fa37442ca7e591  bayline.html" | sha256sum -c -

      - name: Publish artifact and remove staging chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build/bayline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "publish Bayline San Francisco model railway"
          git push
