name: Verify public site
on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages', 'pages build and deployment', 'Configure traffic integrations']
    types: [completed]
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-site-smoke
  cancel-in-progress: false
jobs:
  public-pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed content, metadata, sitemap and runtime files
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, os, re, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          BASE='https://tianxinzh.github.io/simulated-world/'
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'SimulatedWorld-PublicCheck/2.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  assert r.status==200,(url,r.status)
                  return r.read().decode('utf-8')
          def check(p):
              url=p['url'];html=get(url+'?release_check='+str(int(time.time())))
              assert f'<link rel="canonical" href="{url}">' in html,url+' canonical'
              assert 'hreflang="en"' in html and 'hreflang="zh-Hans"' in html,url+' languages'
              assert 'application/ld+json' in html,url+' structured data'
              assert 'content="noindex' not in html,url+' indexability'
              return {'url':url,'http':200,'canonical':True,'hreflang':True}
          for attempt in range(6):
              try:
                  inventory=json.loads(get(BASE+'site-inventory.json?release_check='+str(int(time.time()))))
                  assert len(inventory['pages'])==20
                  with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:pages=list(pool.map(check,inventory['pages']))
                  sitemap=ET.fromstring(get(BASE+'sitemap.xml'))
                  assert len(sitemap.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url'))==20
                  for path in ['assets/growth.js','assets/site-config.js','assets/home.js','monitor/','tools/campaign-builder/','airport.html','bayline.html']:
                      body=get(BASE+path)
                      assert len(body)>100,path
                      if path in ['airport.html','bayline.html']:
                          assert 'SW BRIDGE' in body and 'googletagmanager' not in body,path+' standalone constraint'
                      if path in ['monitor/','tools/campaign-builder/']:assert 'noindex,follow' in body,path+' should not be indexed'
                  req=urllib.request.Request(BASE+'assets/tours/bayport-tour.webm',method='HEAD')
                  with urllib.request.urlopen(req,timeout=20) as r:assert r.status==200
                  robots_url='https://tianxinzh.github.io/robots.txt'
                  try:robots={'url':robots_url,'status':200,'body':get(robots_url)[:5000]}
                  except urllib.error.HTTPError as e:robots={'url':robots_url,'status':e.code}
                  report={'pages':pages,'sitemapEntries':20,'runtimeFiles':'pass','standaloneAnalytics':'absent','tourVideoHTTP':200,'analyticsConfigured':inventory['analyticsConfigured'],'hostRobots':robots,'scope':'HTTP delivery and content checks, not proof of provider analytics delivery or search indexing.'}
                  print(json.dumps(report,ensure_ascii=False,indent=2))
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('## Public release verified\n\n20 canonical bilingual pages, sitemap, player files, analytics code and tour video are reachable.\n\nAnalytics ID configured: '+str(inventory['analyticsConfigured'])+'. This does not verify provider ownership, analytics delivery or search indexing.\n')
                  break
              except Exception as e:
                  print('Attempt',attempt+1,'failed:',str(e),flush=True)
                  if attempt==5:raise
                  time.sleep(8)
          PY
