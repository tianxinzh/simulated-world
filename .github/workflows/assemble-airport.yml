name: Assemble BAYPORT airport demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-airport.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify final HTML
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/airport_payload_1.b64 .tmp/airport_payload_2.b64 .tmp/airport_payload_3.b64 > /tmp/airport_payload.b64
          base64 --decode /tmp/airport_payload.b64 | gzip --decompress > airport.html

          expected_sha='fdea390911b48d98a014d7c8b3db9c3dcc0c8746545d6407a31bed80c4613d9e'
          actual_sha="$(sha256sum airport.html | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          test "$(wc -c < airport.html)" -eq 109919

          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          old = '<span class="pill" data-en="Coming first" data-zh="即将上线">Coming first</span>'
          new = '<a class="pill" style="text-decoration:none" href="airport.html" data-en="Launch demo ↗" data-zh="打开机场 ↗">Launch demo ↗</a>'
          if old not in html:
              raise SystemExit('Airport launch placeholder not found in index.html')
          path.write_text(html.replace(old, new, 1))
          PY

          rm -rf .tmp

      - name: Publish assembled demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airport.html index.html .tmp
          git commit -m 'Add BAYPORT airport simulator'
          git push
