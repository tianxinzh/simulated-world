name: Assemble BAYPORT airport demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-airport.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair staged payload, assemble, and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('.tmp/airport_payload_3.b64')
          s = p.read_text()
          target_len = 17136
          target_blob = '3856f31be98bd3aca304beac6b6d9e8daecdb1fb'
          target_sha = '40a6151c8af1d0d4d17914c3b240f262caecbe62b227594f62b2c4dceb062f9a'
          checkpoints = [
            (512,'b8c3db641df548eee57a11b7bc0e7c300d2876ff2d8560fb7a6fc617655d9fec'),
            (1024,'d8a5165087f9050f4e8056795386c124c4ab07f5bd0f00c869281b7b6af14085'),
            (1536,'886363f9f02d22bd75044520ff8df260a28197875f1f35ce1bd8aecaca4477ed'),
            (2048,'c74e157d52bca3984995532f4326d239e1f65304546957b86c995e2d15adc0f7'),
            (2560,'b21b5d05dafaec77fd8339bed8e5e21d2f5ef45171ed6186d28c0a2828675f09'),
            (3072,'afc4022922047f06390516e76e0f84c44d5e3c4692f4eb0ff9c4e3edf9c4a655'),
            (3584,'30db0c57511d4a5fbc81b70d90b38801e2314afb85c9c14e8e6a1930321774c8'),
            (4096,'32191f75051a892ae2ef3ed29759c0717c39455283fc2da6a131175721fd7c9b'),
            (4608,'13574f8f1618e9cc306bf33d608829b46c821478940a8c8544d076823516b7f3'),
            (5120,'95e30caed0553ce20185d5feff5c17c736d783cbe0fd9375c6c8d5b063381c50'),
            (5632,'ff603697f919c486df70e814b5624c8f8581b0cf78a3ac76ce01dc08ad56d026'),
            (6144,'405c71894d968d0df9bb1271383d73cfc651902bc29f3a019b5fc187656774d5'),
            (6656,'7982407db844a8a341eb0ea54bdf285607e97cf837236f557da7e2882db1608f'),
            (7168,'2732a94193579f4db33fdf45762cb8faae08850803b516f84d96b6949400e56c'),
            (7680,'868994b72f076047609003f03b285f3c02711749cfc0c687b389094292b85408'),
            (8192,'ec9076d76fec75b0710c3b91ddebf64893419b7bc455ab6d1df757e34e0d2edb'),
            (8704,'b2a63b02796c2dda7e99fcd008f7c7269199ab6a591a6b2a6ba0e7695337bf4b'),
            (9216,'e235386896dcad95d9ee657c096b58094b23a59e5cf650f16e4cea2024a941c5'),
            (9728,'0116303c9130c1f05588f9a7cd2ba5b2d380201ac9666a4786a4bb39d5485833'),
            (10240,'6f244da68d73794cb0ead9768b8828d2f6823072e77edbb5fe3ef42f90fdfad5'),
            (10752,'b21eca9170bd86e5dee9837b85ef0fb389d82a6e8046e410eaa40d206b7049b1'),
            (11264,'ca2afc1443643c8e3f49839684a14bc48f5b7eb831126a341488fcdeca749081'),
            (11776,'4d3d9da7969f058670e53fa5c94e6d8134b4fc89e1e94f382648ae040994c776'),
            (12288,'02515d695b00f2afeab8e9ba956be31380c155d0adba06c87f77fe59417af0ed'),
            (12800,'5d7408ee9f238822927afdb8cce22f9a8222172f48524267dba9b684b748546b'),
            (13312,'3ef13451e576835f2ada52a4f4635bfe0be2344a93828fc9015c42408a60632e'),
            (13824,'f789fbc053a21b338f94c61b320dc36c238ef7ce10792b42838e9e015dc79eb7'),
            (14336,'3e121b109fa057868cdba9e6ee8d7f722989898d3f3f31570f1b103c4cea3d7f'),
            (14848,'e3fd5c778a64084c45f1595ad2bcafa4b4939c7a2284089442647a6d0d2053f5'),
            (15360,'86434329e197a5933bd2ce8f226f5c6481b52f7323ad561891ca01e183fa69e3'),
            (15872,'0e7cbc1a7ea86227f7f0ffe7847b54694f1d1188a5fa12dad7d0a4f0f757a4df'),
            (16384,'dd51fd72664dbff415358695bfaa7c2864b2cb8b33aa77b988e00cc19ed49cec'),
            (16896,'5ad1919596303e8eac811fd1c449875b2e9dfe493feb7f76142a99916cbc99ec'),
          ]

          def git_blob_sha(text):
              raw = text.encode()
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()

          if len(s) == target_len - 1:
              lo, hi = 0, target_len
              for n, expected in checkpoints:
                  if hashlib.sha256(s[:n].encode()).hexdigest() == expected:
                      lo = n
                  else:
                      hi = n
                      break
              alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              repaired = None
              for pos in range(max(0, lo), min(len(s), hi) + 1):
                  for ch in alphabet:
                      candidate = s[:pos] + ch + s[pos:]
                      if git_blob_sha(candidate) == target_blob:
                          repaired = candidate
                          break
                  if repaired is not None:
                      break
              if repaired is None:
                  raise SystemExit(f'Could not repair staged payload in interval {lo}:{hi}')
              s = repaired
              p.write_text(s)

          if len(s) != target_len or hashlib.sha256(s.encode()).hexdigest() != target_sha:
              raise SystemExit('Staged payload 3 verification failed')
          PY

          cat .tmp/airport_payload_1.b64 .tmp/airport_payload_2.b64 .tmp/airport_payload_3.b64 > /tmp/airport_payload.b64
          base64 --decode /tmp/airport_payload.b64 | gzip --decompress > airport.html

          expected_sha='fdea390911b48d98a014d7c8b3db9c3dcc0c8746545d6407a31bed80c4613d9e'
          actual_sha="$(sha256sum airport.html | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          test "$(wc -c < airport.html)" -eq 109919

          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          old = '<span class="pill" data-en="Coming first" data-zh="即将上线">Coming first</span>'
          new = '<a class="pill" style="text-decoration:none" href="airport.html" data-en="Launch demo ↗" data-zh="打开机场 ↗">Launch demo ↗</a>'
          if old not in html:
              raise SystemExit('Airport launch placeholder not found in index.html')
          path.write_text(html.replace(old, new, 1))
          PY

          rm -rf .tmp

      - name: Publish assembled demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airport.html index.html .tmp
          git commit -m 'Add BAYPORT airport simulator'
          git push
